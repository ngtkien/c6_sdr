CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_REQUIRES_FLOAT_PRINTF=y
CONFIG_CPP=y

# bsp_init() touches i2c0 (LDOs)
CONFIG_I2C=y

# capture buf + app framebuffer live in PSRAM (.ext_ram.bss); the DSI
# driver additionally allocs 2 x 1.8MB ping-pong fbs from the heap
CONFIG_ESP_SPIRAM=y
CONFIG_ESP_SPIRAM_HEAP_SIZE=8388608
CONFIG_HEAP_MEM_POOL_SIZE=32768

# ESP32-C6 co-processor on SDIO slot 1 (esp_hosted_ng driver)
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_SDHC=y
CONFIG_SDIO_STACK=y

# SD card on SDIO slot 0 receives capture dumps
CONFIG_DISK_ACCESS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FS_FATFS_MOUNT_MKFS=y

# EK79007 DSI waterfall
CONFIG_DISPLAY=y
CONFIG_MIPI_DSI=y
CONFIG_MIPI_DSI_ESP32P4_ZERO_COPY=y

CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_ESP32=y

# GT911 capacitive touch (LCD sub-board, I2C polling)
CONFIG_INPUT=y
CONFIG_INPUT_GT911=y
CONFIG_INPUT_GT911_PERIOD_MS=20

# ES8311 speaker out (demod blips in IQ view)
CONFIG_I2S=n
CONFIG_AUDIO=n
CONFIG_AUDIO_CODEC=n
