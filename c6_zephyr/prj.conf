# Zephyr-hosted ESP32-C6 slave application for c6_sdr.
# Boot: ESP-IDF 2nd-stage bootloader + otadata (OTA images into ota_0/ota_1).
CONFIG_ESP_C6_OTA_BOOT_PROBE=y

# SDIO slave peripheral (hosted transport to P4).
CONFIG_ESP32C6_SDIO_SLAVE=y

# Hosted RPC wire codec + OTA flash writes.
CONFIG_NANOPB=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_THREAD_NAME=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_CRC=y
